# YORU女 自動投稿 — PCの電源に関係なくGitHubのクラウドで実行される
name: autopost

on:
  schedule:
    # UTC表記。JST 6〜24時の毎正時（1日19本）。
    - cron: "0 0-15,21-23 * * *"
  workflow_dispatch: # 手動実行ボタンも使える
    inputs:
      post_type:
        description: "投稿タイプ（空なら時刻から自動判定）"
        required: false
        type: choice
        options: ["", "therapist", "review"]

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 投稿済みマークをコミットで書き戻すため
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Post to YORU女
        run: node post.mjs
        env:
          YORUJO_EMAIL: ${{ secrets.YORUJO_EMAIL }}
          YORUJO_PASSWORD: ${{ secrets.YORUJO_PASSWORD }}
          POST_TYPE: ${{ inputs.post_type }}

      - name: Save state
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "actions@github.com"
          git pull --rebase || true
          git add state-aoi.json
          git diff --cached --quiet || git commit -m "湊あおい投稿の状態を更新"
          git push
        continue-on-error: true

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error.png
          if-no-files-found: ignore
