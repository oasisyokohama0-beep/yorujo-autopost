# YORU女 自動投稿（店舗アカウント・横浜／渋谷／錦糸町）
# 1回の起動で3店舗を順番に投稿する（準備処理を3回繰り返さないぶん実行時間の節約になる）
name: autopost-store

on:
  schedule:
    # UTC表記。JST 6〜24時の毎正時（1日19本）。日記→口コミ→在籍紹介を1時間ごとに回し、21時はランキング（5日に1回）
    - cron: "40 0-15,21-23 * * *"
  workflow_dispatch:
    inputs:
      store:
        description: "投稿する店舗（空なら3店舗すべて）"
        required: false
        type: choice
        options: ["", "yokohama", "shibuya", "kinshicho"]
      post_type:
        description: "投稿タイプ（空なら時刻から自動判定）"
        required: false
        type: choice
        options: ["", "diary", "review", "therapist", "ranking"]

concurrency:
  group: autopost-store
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 投稿済み状態（state-*.json）をコミットで書き戻すため
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: 横浜店
        id: yokohama
        if: ${{ inputs.store == '' || inputs.store == 'yokohama' }}
        continue-on-error: true
        run: node post-store.mjs
        env:
          STORE: yokohama
          YORUJO_EMAIL: ${{ secrets.YORUJO_YOKOHAMA_EMAIL }}
          YORUJO_PASSWORD: ${{ secrets.YORUJO_YOKOHAMA_PASSWORD }}
          YORUJO_ID: ${{ vars.YORUJO_YOKOHAMA_ID }}
          POST_TYPE: ${{ inputs.post_type }}

      - name: 渋谷店
        id: shibuya
        if: ${{ inputs.store == '' || inputs.store == 'shibuya' }}
        continue-on-error: true
        run: node post-store.mjs
        env:
          STORE: shibuya
          YORUJO_EMAIL: ${{ secrets.YORUJO_SHIBUYA_EMAIL }}
          YORUJO_PASSWORD: ${{ secrets.YORUJO_SHIBUYA_PASSWORD }}
          YORUJO_ID: ${{ vars.YORUJO_SHIBUYA_ID }}
          POST_TYPE: ${{ inputs.post_type }}

      - name: 錦糸町店
        id: kinshicho
        if: ${{ inputs.store == '' || inputs.store == 'kinshicho' }}
        continue-on-error: true
        run: node post-store.mjs
        env:
          STORE: kinshicho
          YORUJO_EMAIL: ${{ secrets.YORUJO_KINSHICHO_EMAIL }}
          YORUJO_PASSWORD: ${{ secrets.YORUJO_KINSHICHO_PASSWORD }}
          YORUJO_ID: ${{ vars.YORUJO_KINSHICHO_ID }}
          POST_TYPE: ${{ inputs.post_type }}

      - name: Save state
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "actions@github.com"
          for f in state-yokohama.json state-shibuya.json state-kinshicho.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "更新なし"
            exit 0
          fi
          git commit -m "店舗投稿の状態を更新"
          # 他のワークフローが同時に書き戻していることがあるので数回やり直す
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          echo "状態の書き戻しに失敗しました"
        continue-on-error: true

      - name: 失敗した店舗を知らせる
        if: always()
        run: |
          fails=""
          if [ "${{ steps.yokohama.outcome }}" = "failure" ]; then fails="$fails 横浜店"; fi
          if [ "${{ steps.shibuya.outcome }}" = "failure" ]; then fails="$fails 渋谷店"; fi
          if [ "${{ steps.kinshicho.outcome }}" = "failure" ]; then fails="$fails 錦糸町店"; fi
          if [ -n "$fails" ]; then
            echo "投稿に失敗した店舗:$fails"
            exit 1
          fi
          echo "失敗した店舗はありません"

      - name: Upload error screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot-store
          path: error-*.png
          if-no-files-found: ignore
